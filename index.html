        function fillTargetSelect(sel, selectedId) {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = '-- 选择物品 --';
            sel.appendChild(option);

            const categories = {
                'weapon': '武器',
                'armor': '防具',
                'accessory': '饰品',
                'material': '材料',
                'totem': '图腾',
                'blueprint': '图纸',
                'food': '食物',
                'tool': '工具',
                'lootBag': '战利品袋',
                'currency': '货币',
                'other': '其他'
            };

            const grouped = {};
            for (const [itemId, itemInfo] of Object.entries(ITEM_DEFS)) {
                const recipe = findRecipe(itemId);
                if (recipe) {
                    const cat = recipe.cat || 'other';
                    if (!grouped[cat]) grouped[cat] = [];
                    grouped[cat].push({ id: itemId, name: itemInfo.name });
                }
            }

            for (const [cat, items] of Object.entries(grouped)) {
                const optgroup = document.createElement('optgroup');
                optgroup.label = categories[cat] || cat;

                items.sort((a, b) => a.name.localeCompare(b.name, 'zh-CN'));

                for (const item of items) {
                    const option = document.createElement('option');
                    option.value = item.id;
                    option.textContent = item.name;
                    if (item.id === selectedId) option.selected = true;
                    optgroup.appendChild(option);
                }

                sel.appendChild(optgroup);
            }
        }

        // 计算（多目标合并）
        function calculate() {
            if (!dataReady) {
                alert('数据尚未加载完成，请稍候再试');
                return;
            }
            const targets = targetRows.filter(r => r.itemId);
            if (!targets.length) {
                alert('请至少选择一个合成目标');
                return;
            }

            currentTrees = targets.map(t => ({
                tree: buildMaterialTree(t.itemId, t.count || 1),
                label: getItemInfo(t.itemId).name + ' ×' + (t.count || 1)
            }));

            const merged = {};
            for (const t of currentTrees) {
                collectAtomicMaterials(t.tree, merged);
            }
            currentSummary = merged;

            updateDisplay();
            document.getElementById('importAllBtn').style.display = '';
        }

        function updateDisplay() {
            if (!currentTrees.length) return;

            const treeContainer = document.getElementById('materialTree');
            const summaryContainer = document.getElementById('materialSummary');

            treeContainer.innerHTML = '';
            for (const t of currentTrees) {
                const header = document.createElement('div');
                header.className = 'tree-target-header';
                header.textContent = t.label;
                treeContainer.appendChild(header);
                const wrap = document.createElement('div');
                renderMaterialTree(t.tree, wrap);
                treeContainer.appendChild(wrap);
            }

            renderSummary(currentSummary, summaryContainer);
        }

        function resetPanels() {
            currentTrees = [];
            currentSummary = null;
            document.getElementById('importAllBtn').style.display = 'none';
            document.getElementById('materialTree').innerHTML =
                '<div class="empty-state"><div class="empty-state-icon">⚒</div><div>请选择合成目标并点击「计算材料」</div></div>';
            document.getElementById('materialSummary').innerHTML =
                '<div class="empty-state"><div class="empty-state-icon">☰</div><div>统计结果将显示在这里</div></div>';
        }

        // ------------------------------------------------------------------
        // 页签二：挂机时间计算
        // ------------------------------------------------------------------
        function isFarmable(itemId) {
            return Array.isArray(DROPPABLE[itemId]) && DROPPABLE[itemId].length > 0;
        }

        function noFarmReason(itemId) {
            const info = getItemInfo(itemId);
            if (itemId === 'currency') return '击杀怪物按品阶获得，见挂机页神域币';
            if (SHOP_PRICES[itemId]) {
                return `商店有售（${fmtInt(SHOP_PRICES[itemId].buy)} 神域币/个）`;
            }
            if (itemId === 'bread') return '主城每5秒自动产出';
            return '无怪物掉落来源';
        }

        function bestMonsterFor(itemId) {
            const ids = DROPPABLE[itemId] || [];
            return ids.length ? ids[0] : '';
        }

        // 掉落该材料的怪物列表（按期望降序）
        function monstersForItem(itemId) {
            const ids = DROPPABLE[itemId] || [];
            return ids.map(id => MONSTER_BY_ID[id]).filter(Boolean);
        }

        function addFarmRow(itemId, count, monsterId, flash) {
            const itemId_ = itemId || '';
            farmRows.push({
                uid: uidSeed++,
                itemId: itemId_,
                count: count || 1,
                monsterId: monsterId || bestMonsterFor(itemId_),
                sec: ''
            });
            renderFarmRows();
            if (flash) {
                calcFarm();
                const cards = document.querySelectorAll('#farmCards .farm-card');
                if (cards.length) cards[cards.length - 1].classList.add('highlight');
            }
        }

        function removeFarmRow(uid) {
            farmRows = farmRows.filter(r => r.uid !== uid);
            if (!farmRows.length) {
                farmRows.push({ uid: uidSeed++, itemId: '', count: 1, monsterId: '', sec: '' });
            }
            renderFarmRows();
            calcFarm();
        }

        function renderFarmRows() {
            const wrap = document.getElementById('farmRows');
            wrap.innerHTML = '';
            for (const row of farmRows) {
                const div = document.createElement('div');
                div.className = 'control-row';

                // 材料选择
                const matSel = document.createElement('select');
                const opt0 = document.createElement('option');
                opt0.value = '';
                opt0.textContent = '-- 选择材料 --';
                matSel.appendChild(opt0);
                const droppableIds = Object.keys(DROPPABLE).sort((a, b) =>
                    getItemInfo(a).name.localeCompare(getItemInfo(b).name, 'zh-CN'));
                for (const id of droppableIds) {
                    const o = document.createElement('option');
                    o.value = id;
                    o.textContent = getItemInfo(id).name;
                    if (id === row.itemId) o.selected = true;
                    matSel.appendChild(o);
                }
                matSel.onchange = () => {
                    row.itemId = matSel.value;
                    row.monsterId = bestMonsterFor(row.itemId);
                    renderFarmRows();
                    calcFarm();
                };
                div.appendChild(matSel);

                // 数量
                const cntGroup = document.createElement('div');
                cntGroup.className = 'control-group';
                const cntLabel = document.createElement('label');
                cntLabel.textContent = '数量';
                const cnt = document.createElement('input');
                cnt.type = 'number';
                cnt.value = row.count;
                cnt.min = 1;
                cnt.oninput = () => {
                    row.count = parseInt(cnt.value) || 1;
                    calcFarm();
                };
                cntGroup.appendChild(cntLabel);
                cntGroup.appendChild(cnt);
                div.appendChild(cntGroup);

                // 怪物选择（数据刷新后 id 失效时自动回落到最优怪物）
                if (row.itemId && row.monsterId && !MONSTER_BY_ID[row.monsterId]) {
                    row.monsterId = bestMonsterFor(row.itemId);
                }
                const monSel = document.createElement('select');
                fillMonsterSelect(monSel, row.itemId, row.monsterId);
                monSel.onchange = () => {
                    row.monsterId = monSel.value;
                    calcFarm();
                };
                div.appendChild(monSel);

                // 秒/只覆盖
                const secGroup = document.createElement('div');
                secGroup.className = 'control-group';
                const secLabel = document.createElement('label');
                secLabel.textContent = '秒/只';
                const sec = document.createElement('input');
                sec.type = 'number';
                sec.className = 'small';
                sec.value = row.sec;
                sec.placeholder = '默认';
                sec.min = 0.1;
                sec.step = 0.5;
                sec.oninput = () => {
                    row.sec = sec.value;
                    calcFarm();
                };
                secGroup.appendChild(secLabel);
                secGroup.appendChild(sec);
                div.appendChild(secGroup);

                // 移除
                const rm = document.createElement('button');
                rm.className = 'row-remove';
                rm.type = 'button';
                rm.textContent = '×';
                rm.title = '移除该材料';
                rm.onclick = () => removeFarmRow(row.uid);
                div.appendChild(rm);

                wrap.appendChild(div);
            }
        }

        function fillMonsterSelect(sel, itemId, selectedId) {
            const option = document.createElement('option');
            option.value = '';
            option.textContent = '-- 怪物 --';
            sel.appendChild(option);

            for (const m of monstersForItem(itemId)) {
                const e = m.expDrops[itemId] || 0;
                const o = document.createElement('option');
                o.value = m.id;
                o.textContent = `${m.name} · ${m.location}（${fmtNum(e)}/只）`;
                if (m.id === selectedId) o.selected = true;
                sel.appendChild(o);
            }
        }

        // 挂机时间计算
        function calcFarm() {
            const cardsContainer = document.getElementById('farmCards');
            const totalContainer = document.getElementById('farmTotal');

            const rows = farmRows.filter(r => r.itemId);
            if (!rows.length) {
                cardsContainer.innerHTML =
                    '<div class="empty-state"><div class="empty-state-icon">⏳</div><div>添加材料并选择刷取怪物，估算挂机时长</div></div>';
                totalContainer.innerHTML = '';
                return;
            }

            const defaultSec = parseFloat(document.getElementById('farmDefaultSec').value) || 5;

            cardsContainer.innerHTML = '';
            const results = [];

            for (const row of rows) {
                const card = document.createElement('div');
                card.className = 'farm-card';

                const info = getItemInfo(row.itemId);
                const head = document.createElement('div');
                head.className = 'farm-card-head';
                const icon = createItemImg(info.img, '');
                if (icon) {
                    attachEquipTooltip(icon, row.itemId);
                    head.appendChild(icon);
                }
                const title = document.createElement('div');
                title.className = 'farm-card-title';
                const nameSpan = document.createElement('span');
                nameSpan.className = 'name';
                nameSpan.textContent = info.name;
                attachEquipTooltip(nameSpan, row.itemId);
                const qtySpan = document.createElement('span');
                qtySpan.className = 'qty';
                qtySpan.textContent = '×' + fmtInt(row.count);
                title.appendChild(nameSpan);
                title.appendChild(qtySpan);
                head.appendChild(title);
                card.appendChild(head);

                if (!isFarmable(row.itemId)) {
                    const invalid = document.createElement('div');
                    invalid.className = 'invalid-row';
                    invalid.textContent = '该材料没有怪物掉落来源' + (noFarmReason(row.itemId) !== '无怪物掉落来源' ? '（' + noFarmReason(row.itemId) + '）' : '');
                    card.appendChild(invalid);
                    cardsContainer.appendChild(card);
                    continue;
                }

                const monster = MONSTER_BY_ID[row.monsterId] || MONSTER_BY_ID[bestMonsterFor(row.itemId)];
                if (!monster) continue;
                const exp = monster.expDrops[row.itemId] || 0;
                if (exp <= 0) continue;

                const kills = row.count / exp;
                const secPerKill = parseFloat(row.sec) || defaultSec;
                const seconds = kills * secPerKill;
                const killsCeil = Math.ceil(kills);
                const summonCoin = typeof monster.summonCoin === 'number' ? monster.summonCoin * kills : null;
                const summonItems = (monster.summonItems || []).map(si => ({
                    item: si.item,
                    count: si.count * kills
                }));

                results.push({ row, monster, exp, kills, seconds, killsCeil, summonCoin, summonItems });

                // 怪物行
                card.appendChild(farmLine('刷取怪物', `${monster.name}`, `<span class="monster-info">${monster.location} · ${monster.tierName ? monster.tierName + ' · ' : ''}预期 ${fmtNum(exp)}/只</span>`));
                card.appendChild(farmLine('预计击杀', `≈ ${fmtInt(killsCeil)} 只`));
                card.appendChild(farmLine('挂机时长', fmtTime(seconds), null, true));

                if (typeof monster.summonCoin === 'number' && monster.summonCoin > 0) {
                    card.appendChild(farmLine('召唤神域币', fmtInt(Math.ceil(summonCoin))));
                }
                if (summonItems.length) {
                    const line = farmLine('召唤材料', '');
                    const chips = document.createElement('div');
                    chips.className = 'farm-mat-list';
                    for (const si of summonItems) {
                        chips.appendChild(matChip(si.item, '×' + fmtInt(Math.ceil(si.count))));
                    }
                    line.appendChild(chips);
                    card.appendChild(line);
                }
                if (monster.feeNote) {
                    const note = document.createElement('div');
                    note.className = 'farm-line';
                    note.innerHTML = `<span class="k">进入消耗</span><span class="note">${monster.feeNote}（每次进入可连续刷怪，费用未计入汇总）</span>`;
                    card.appendChild(note);
                }

                cardsContainer.appendChild(card);
            }

            // ===== 汇总 =====
            if (!results.length) {
                totalContainer.innerHTML = '';
                return;
            }

            const totalSec = results.reduce((s, r) => s + r.seconds, 0);
            const byMonster = {};
            for (const r of results) {
                byMonster[r.monster.id] = (byMonster[r.monster.id] || 0) + r.kills;
            }
            const summonAgg = {};
            let coinAgg = 0;
            let hasSummon = false;
            for (const r of results) {
                if (typeof r.monster.summonCoin === 'number' && r.monster.summonCoin > 0) {
                    coinAgg += r.monster.summonCoin * r.kills;
                    hasSummon = true;
                }
                for (const si of r.summonItems) {
                    summonAgg[si.item] = (summonAgg[si.item] || 0) + si.count;
                    hasSummon = true;
                }
            }

            const total = document.createElement('div');
            total.className = 'farm-total';

            const title = document.createElement('div');
            title.className = 'farm-total-title';
            title.textContent = '汇总';
            total.appendChild(title);

            const bigTime = document.createElement('div');
            bigTime.className = 'big-time';
            bigTime.textContent = fmtTime(totalSec);
            total.appendChild(bigTime);

            total.appendChild(totalLine('合计时长', fmtTime(totalSec) + `（${fmtNum(totalSec / 3600, 2)} 小时）`));

            const killLines = Object.entries(byMonster).map(([mid, k]) => {
                const m = MONSTER_BY_ID[mid];
                return `${m.name} ×${fmtInt(Math.ceil(k))}`;
            });
            total.appendChild(totalLine('怪物击杀数', killLines.join('、')));

            if (hasSummon) {
                if (coinAgg > 0) {
                    total.appendChild(totalLine('召唤神域币合计', '×' + fmtInt(Math.ceil(coinAgg))));
                }
                const chips = document.createElement('div');
                chips.className = 'farm-mat-list';
                const keys = Object.keys(summonAgg);
                if (keys.length) {
                    total.appendChild(totalLine('召唤材料合计', ''));
                    for (const k of keys) {
                        chips.appendChild(matChip(k, '×' + fmtInt(Math.ceil(summonAgg[k]))));
                    }
                    total.lastChild.appendChild(chips);
                }
            }

            totalContainer.innerHTML = '';
            totalContainer.appendChild(total);
        }

        function farmLine(label, valueHtml, extraHtml, gold) {
            const div = document.createElement('div');
            div.className = 'farm-line';
            const k = document.createElement('span');
            k.className = 'k';
            k.textContent = label;
            div.appendChild(k);
            const v = document.createElement('span');
            v.className = 'v' + (gold ? ' gold' : '');
            if (valueHtml) v.textContent = valueHtml;
            div.appendChild(v);
            if (extraHtml) {
                const span = document.createElement('span');
                span.innerHTML = extraHtml;
                div.appendChild(span);
            }
            return div;
        }

        function totalLine(label, valueText) {
            const div = document.createElement('div');
            div.className = 'farm-total-line';
            const k = document.createElement('span');
            k.className = 'k';
            k.textContent = label;
            const v = document.createElement('span');
            v.className = 'v';
            v.textContent = valueText;
            div.appendChild(k);
            div.appendChild(v);
            return div;
        }

        function matChip(itemId, countText) {
            const chip = document.createElement('span');
            chip.className = 'farm-mat-chip';
            const icon = createItemImg(getItemInfo(itemId).img, '');
            if (icon) {
                attachEquipTooltip(icon, itemId);
                chip.appendChild(icon);
            }
            const name = document.createElement('span');
            name.textContent = getItemInfo(itemId).name;
            attachEquipTooltip(name, itemId);
            const n = document.createElement('span');
            n.className = 'n';
            n.textContent = countText;
            chip.appendChild(name);
            chip.appendChild(n);
            return chip;
        }

        // 从材料统计带入挂机计算
        function importToFarm(itemId, count, switchTab) {
            if (!isFarmable(itemId)) {
                alert(`「${getItemInfo(itemId).name}」没有怪物掉落来源\n${noFarmReason(itemId)}`);
                return;
            }
            const existing = farmRows.find(r => r.itemId === itemId);
            if (existing) {
                existing.count = count;
            } else {
                farmRows.push({
                    uid: uidSeed++,
                    itemId: itemId,
                    count: count,
                    monsterId: bestMonsterFor(itemId),
                    sec: ''
                });
            }
            renderFarmRows();
            calcFarm();
            if (switchTab) switchToTab('farm');
        }

        function importAllToFarm() {
            if (!currentSummary) return;
            const farmableIds = Object.keys(currentSummary)
                .filter(id => isFarmable(id) && currentSummary[id].count > 0);
            if (!farmableIds.length) {
                alert('当前统计中没有可刷取的怪物掉落材料');
                return;
            }
            for (const id of farmableIds) {
                const existing = farmRows.find(r => r.itemId === id);
                if (existing) {
                    existing.count = currentSummary[id].count;
                } else {
                    farmRows.push({
                        uid: uidSeed++,
                        itemId: id,
                        count: currentSummary[id].count,
                        monsterId: bestMonsterFor(id),
                        sec: ''
                    });
                }
            }
            // 清掉空行
            farmRows = farmRows.filter(r => r.itemId);
            renderFarmRows();
            calcFarm();
            switchToTab('farm');
        }

        function switchToTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.tab === tab);
            });
            document.querySelectorAll('.tab-page').forEach(p => {
                p.classList.toggle('active', p.id === 'tab-' + tab);
            });
        }

        // ------------------------------------------------------------------
        // 工具函数
        // ------------------------------------------------------------------
        function fmtInt(n) {
            return Math.round(n).toLocaleString('zh-CN');
        }

        function fmtNum(n, digits) {
            if (!isFinite(n)) return '∞';
            if (n >= 100) return fmtInt(n);
            const d = digits != null ? digits : 2;
            return n.toFixed(d).replace(/\.?0+$/, '') || '0';
        }

        function fmtTime(sec) {
            if (!isFinite(sec)) return '∞';
            const s = Math.round(sec);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const ss = s % 60;
            if (h > 0) return `${h}小时${m}分${ss}秒`;
            if (m > 0) return `${m}分${ss}秒`;
            return `${ss}秒`;
        }

        // ------------------------------------------------------------------
        // 数据加载与刷新
        // ------------------------------------------------------------------
        function fmtTimeOfDay(t) {
            return new Date(t).toLocaleTimeString('zh-CN', { hour12: false });
        }

        function setStatus(text, warn) {
            const el = document.getElementById('dataStatus');
            el.textContent = text;
            const wrap = document.getElementById('dataStatusWrap');
            wrap.classList.toggle('warn', !!warn);
        }

        async function loadDefs(force) {
            const seq = ++loadSeq;
            if (force) setStatus('正在刷新数据…');
            try {
                const res = await fetch(API_PATH, force ? { cache: 'reload' } : undefined);
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const defs = await res.json();
                if (seq !== loadSeq) return; // 已有更新的请求在处理
                applyDefs(defs, true);
            } catch (e) {
                if (seq !== loadSeq) return;
                if (dataReady) {
                    setStatus('刷新失败，继续使用 ' + fmtTimeOfDay(lastFetchAt) + ' 拉取的数据', true);
                    return;
                }
                const cached = readCache();
                if (cached) {
                    applyDefs(cached.defs, false, cached.t);
                } else {
                    setStatus('数据加载失败（上游不可达且无本地缓存）', true);
                    document.getElementById('materialTree').innerHTML =
                        '<div class="empty-state"><div class="empty-state-icon">⚠</div><div>数据加载失败，请点击右上角「刷新数据」重试</div></div>';
                }
            }
        }

        function applyDefs(defs, live, cachedAt) {
            const built = buildData(defs);
            ITEM_DEFS = built.items;
            RECIPES = built.recipes;
            SHOP_PRICES = defs.SHOP_PRICES || {};
            dataReady = true;
            if (live) {
                lastFetchAt = Date.now();
                saveCache(defs);
            }

            // 构建怪物注册表与掉落索引
            const reg = buildMonsters(defs);
            MONSTERS = reg.monsters;
            MONSTER_BY_ID = {};
            for (const m of MONSTERS) MONSTER_BY_ID[m.id] = m;
            DROPPABLE = {};
            for (const [item, ids] of Object.entries(reg.index)) {
                DROPPABLE[item] = ids.sort((a, b) =>
                    (MONSTER_BY_ID[b].expDrops[item] || 0) - (MONSTER_BY_ID[a].expDrops[item] || 0));
            }

            rebuildSelects();

            const recipeCount = Object.keys(RECIPES).length;
            const monsterCount = MONSTERS.length;
            if (live) {
                setStatus(`数据来自 kt.ikui.vip · ${recipeCount} 条配方 · ${monsterCount} 种可刷怪物 · 拉取于 ${fmtTimeOfDay(lastFetchAt)}`);
            } else {
                setStatus(`网络异常，使用离线缓存 · ${recipeCount} 条配方 · ${monsterCount} 种可刷怪物 · 缓存于 ${fmtTimeOfDay(cachedAt)}`, true);
            }

            // 若之前已算过材料，用新数据重算
            if (currentTrees.length) {
                const targets = targetRows.filter(r => r.itemId);
                if (targets.length) {
                    calculate();
                } else {
                    resetPanels();
                }
            }
            calcFarm();
        }

        function rebuildSelects() {
            renderTargetRows();
            renderFarmRows();
        }

        // 初始化
        async function init() {
            document.getElementById('refreshBtn').onclick = () => loadDefs(true);

            // 页签切换
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.onclick = () => switchToTab(btn.dataset.tab);
            });

            // 默认各留一行
            if (!targetRows.length) {
                targetRows.push({ uid: uidSeed++, itemId: '', count: 1 });
            }
            if (!farmRows.length) {
                farmRows.push({ uid: uidSeed++, itemId: '', count: 1, monsterId: '', sec: '' });
            }
            renderTargetRows();
            renderFarmRows();

            await loadDefs();

            // 页面驻留时定期自动刷新（仅前台标签页）
            setInterval(() => {
                if (document.visibilityState === 'visible') {
                    loadDefs();
                }
            }, REFRESH_INTERVAL);

            // 切回标签页时，若数据已超过 10 分钟则刷新
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible' &&
                    lastFetchAt && Date.now() - lastFetchAt > REFRESH_INTERVAL / 3) {
                    loadDefs();
                }
            });
        }

        init();
    </script>
</body>
</html>
